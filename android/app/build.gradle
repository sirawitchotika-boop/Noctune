// Phase 6: candidate signing is opt-in and NEVER changes the signing identity
// of an installed debug Noctune. No keystore or passwords live in Git.
def noctuneCandidate = project.findProperty('noctuneCandidate')?.toString() == 'true'
def noctuneVersion = project.findProperty('noctuneVersionCode')?.toString()
if (noctuneCandidate && !(noctuneVersion ==~ /^[1-9][0-9]{0,7}$/)) {
    throw new GradleException('Candidate versionCode must be a positive integer (1..99999999).')
}
def candidateStore = System.getenv('NOCTUNE_SIGNING_STORE_FILE')
def candidateStorePass = System.getenv('NOCTUNE_SIGNING_STORE_PASSWORD')
def candidateAlias = System.getenv('NOCTUNE_SIGNING_KEY_ALIAS')
def candidateKeyPass = System.getenv('NOCTUNE_SIGNING_KEY_PASSWORD')
if (noctuneCandidate) {
    if (!candidateStore || !candidateStorePass || !candidateAlias || !candidateKeyPass ||
        !file(candidateStore).isFile()) {
        throw new GradleException('Candidate signing not configured. Use a privately stored keystore; never fall back to the debug key.')
    }
}

apply plugin: 'com.android.application'

android {
    namespace = "com.noctune.player"
    compileSdk = rootProject.ext.compileSdkVersion
    signingConfigs {
        if (noctuneCandidate) {
            candidate {
                storeFile file(candidateStore)
                storePassword candidateStorePass
                keyAlias candidateAlias
                keyPassword candidateKeyPass
            }
        }
    }
    defaultConfig {
        applicationId "com.noctune.player"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (noctuneCandidate ? noctuneVersion.toInteger() : 1)
        versionName "1.0"
        manifestPlaceholders = [noctuneLabel: "@string/app_name"]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            // Each GitHub runner can generate a different debug certificate.
            // Gate 2 must never require uninstalling Boss's existing Noctune data.
            if (project.hasProperty('noctuneGate2')) {
                applicationIdSuffix ".gate2fix"
                versionNameSuffix "-gate2"
                manifestPlaceholders["noctuneLabel"] = "Noctune Gate 2 Fix"
            }
        }
        release {
            if (noctuneCandidate) {
                // Signed, isolated package for TWO-build in-place update testing.
                // Never attempt to overwrite an installed debug-signed Noctune.
                applicationIdSuffix ".rc"
                versionNameSuffix "-rc"
                manifestPlaceholders["noctuneLabel"] = "Noctune RC"
                signingConfig signingConfigs.candidate
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
