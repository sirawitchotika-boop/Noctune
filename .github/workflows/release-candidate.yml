name: Noctune signed RC (manual, isolated)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Positive increasing code; use 1 for first RC, 2 for update check'
        required: true
        type: string
        default: '1'

permissions:
  contents: read

jobs:
  release-candidate:
    # Secrets are never made available when dispatching an unmerged PR branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm ci
      - name: Validate application and tests
        run: npm run check
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify runner Android SDK
        run: test -d "$ANDROID_HOME/platforms"
      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Validate signing prerequisites (no fallback to a debug key)
        env:
          REQUESTED_VERSION: ${{ inputs.version_code }}
          STORE_B64: ${{ secrets.NOCTUNE_RC_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.NOCTUNE_RC_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOCTUNE_RC_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.NOCTUNE_RC_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.NOCTUNE_RC_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if ! [[ "$REQUESTED_VERSION" =~ ^[1-9][0-9]{0,7}$ ]]; then
            echo "Invalid version code; must be 1..99999999"
            exit 1
          fi
          if [[ -z "$STORE_B64" || -z "$STORE_PASS" || -z "$KEY_ALIAS" || -z "$KEY_PASS" || -z "$EXPECTED_CERT" ]]; then
            echo "RC signing secrets or expected public certificate digest are not configured. Aborting without an APK."
            exit 1
          fi
          printf '%s' "$STORE_B64" | base64 --decode > "$RUNNER_TEMP/noctune-rc.jks"
          chmod 600 "$RUNNER_TEMP/noctune-rc.jks"
          test -s "$RUNNER_TEMP/noctune-rc.jks"
          # Check the GitHub-stored keystore BEFORE spending time on an Android build.
          # The private store password is read from an environment variable, never printed.
          EXPECTED="$(printf '%s' "$EXPECTED_CERT" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if ! [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Approved certificate fingerprint is not a valid SHA-256 digest"
            exit 1
          fi
          KEYSTORE_CERT="$(keytool -list -v -keystore "$RUNNER_TEMP/noctune-rc.jks" -alias "$KEY_ALIAS" -storepass:env STORE_PASS |
            sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' |
            tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if ! [[ "$KEYSTORE_CERT" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Could not read the certificate fingerprint from the GitHub keystore secret"
            exit 1
          fi
          if [[ "$KEYSTORE_CERT" != "$EXPECTED" ]]; then
            echo "GitHub keystore certificate does not match NOCTUNE_RC_CERT_SHA256."
            echo "Check NOCTUNE_RC_KEYSTORE_BASE64 against the original backed-up .p12 file; do not generate a new key."
            exit 1
          fi
          echo "GitHub keystore certificate matches the approved fingerprint"
      - name: Sync Android project
        run: npx cap sync android
      - name: Build signed isolated release candidate
        working-directory: android
        env:
          REQUESTED_VERSION: ${{ inputs.version_code }}
          NOCTUNE_SIGNING_STORE_FILE: ${{ runner.temp }}/noctune-rc.jks
          NOCTUNE_SIGNING_STORE_PASSWORD: ${{ secrets.NOCTUNE_RC_STORE_PASSWORD }}
          NOCTUNE_SIGNING_KEY_ALIAS: ${{ secrets.NOCTUNE_RC_KEY_ALIAS }}
          NOCTUNE_SIGNING_KEY_PASSWORD: ${{ secrets.NOCTUNE_RC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon "-PnoctuneCandidate=true" "-PnoctuneVersionCode=$REQUESTED_VERSION" assembleRelease
      - name: Verify package, version, release mode and signer fingerprint
        env:
          REQUESTED_VERSION: ${{ inputs.version_code }}
          EXPECTED_CERT: ${{ vars.NOCTUNE_RC_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          SIGNER="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -1)"
          test -n "$AAPT" && test -n "$SIGNER"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/noctune-badging.txt"
          grep -F "package: name='com.noctune.player.rc' versionCode='$REQUESTED_VERSION' " "$RUNNER_TEMP/noctune-badging.txt"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/noctune-badging.txt"; then
            echo "Candidate APK is debuggable; refusing to upload"
            exit 1
          fi
          # Verify the APK, then compare its X.509 PEM certificate(s) by DER SHA-256.
          # Avoid parsing apksigner's human-readable signer labels across SDK versions.
          "$SIGNER" verify --verbose --print-certs-pem "$APK" > "$RUNNER_TEMP/noctune-signature.txt"
          python3 scripts/verify-apk-cert-pem.py "$RUNNER_TEMP/noctune-signature.txt" "$EXPECTED_CERT"
      - name: Upload verified signed RC APK (not a public release)
        uses: actions/upload-artifact@v4
        with:
          name: noctune-rc-v${{ inputs.version_code }}-signed-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
      - name: Clean up runner signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/noctune-rc.jks"
