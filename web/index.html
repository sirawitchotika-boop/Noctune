<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141619">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Noctune. Your music, without the noise.">
  <title>Noctune</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="wordmark">
        <img src="./icon.svg" alt="" width="38" height="38">
        <div><p class="eyebrow">OFFLINE MUSIC</p><h1>Noctune</h1></div>
      </div>
      <p class="tagline">Your music, without the noise.</p>
    </header>

    <main>
      <nav class="tabs" role="tablist" aria-label="Library views">
        <button class="tab" role="tab" type="button" id="tab-songs" aria-controls="panel-songs" aria-selected="true" data-view="songs">Songs</button>
        <button class="tab" role="tab" type="button" id="tab-favorites" aria-controls="panel-favorites" aria-selected="false" data-view="favorites">Favorites</button>
        <button class="tab" role="tab" type="button" id="tab-playlists" aria-controls="panel-playlists" aria-selected="false" data-view="playlists">Playlists</button>
      </nav>

      <div class="notice" id="notice" role="status" aria-live="polite" hidden></div>
      <label class="search-label" for="search">Search your music</label>
      <input id="search" class="search" type="search" placeholder="Search songs" autocomplete="off">

      <section class="panel" id="panel-songs" role="tabpanel" aria-labelledby="tab-songs">
        <div class="section-heading">
          <div><h2>Library</h2><span id="song-count" class="quiet-count">0 songs</span></div>
          <button class="primary-button" id="add-music" type="button">Add music</button>
        </div>
        <input id="audio-files" type="file" accept="audio/*,.mp3,.m4a,.aac,.flac,.wav,.ogg,.opus,.webm" multiple hidden>
        <div id="songs" class="song-list">
          <p class="empty-copy">Your local songs will appear here.</p>
        </div>
      </section>

      <section class="panel" id="panel-favorites" role="tabpanel" aria-labelledby="tab-favorites" hidden>
        <div class="section-heading"><div><h2>Favorites</h2><span id="favorite-count" class="quiet-count">0 songs</span></div></div>
        <div id="favorites" class="song-list"></div>
      </section>

      <section class="panel" id="panel-playlists" role="tabpanel" aria-labelledby="tab-playlists" hidden>
        <div class="section-heading">
          <div><h2>Playlists</h2><span id="playlist-count" class="quiet-count">0 playlists</span></div>
          <button class="primary-button" id="create-playlist" type="button">New playlist</button>
        </div>
        <div id="playlist-choices" class="playlist-choices" aria-label="Your playlists"></div>
        <div id="playlist-detail" class="playlist-detail" hidden>
          <div class="playlist-heading">
            <h3 id="selected-playlist-title"></h3>
            <div class="playlist-actions">
              <button type="button" class="subtle-button" id="rename-playlist">Rename</button>
              <button type="button" class="subtle-button" id="clear-playlist">Clear</button>
              <button type="button" class="danger-button" id="delete-playlist">Delete</button>
            </div>
          </div>
          <div id="playlist-tracks" class="song-list"></div>
        </div>
      </section>
    </main>

    <footer class="now-playing" aria-label="Now playing">
      <div class="cover" aria-hidden="true"><span>N</span></div>
      <button id="open-player" type="button" class="track-meta open-player" disabled aria-label="Open now playing">
        <strong id="mini-title">Nothing playing</strong><span id="mini-subtitle">Select a song to play</span>
      </button>
      <button id="mini-toggle" type="button" class="mini-play" aria-label="Play or pause" disabled>▶</button>
    </footer>

    <dialog id="player-sheet" class="player-sheet" aria-labelledby="player-heading">
      <div class="player-head">
        <p class="eyebrow">NOW PLAYING</p>
        <button id="close-player" type="button" class="subtle-button">Close</button>
      </div>
      <div class="player-art" aria-hidden="true">N</div>
      <h2 id="player-heading" class="player-title">Nothing playing</h2>
      <p id="player-status" role="status" aria-live="polite" class="player-status">Choose a song in the library</p>

      <div class="progress-labels">
        <output id="position-text" for="seek">0:00</output>
        <output id="duration-text" for="seek">0:00</output>
      </div>
      <label class="visually-hidden" for="seek">Playback position</label>
      <input id="seek" type="range" min="0" max="0" step="1" value="0" disabled>

      <div class="player-actions">
        <button id="previous" type="button" aria-label="Previous track" disabled>⏮</button>
        <button id="toggle" type="button" class="large-play" aria-label="Play or pause" disabled>▶</button>
        <button id="next" type="button" aria-label="Next track" disabled>⏭</button>
      </div>
      <button id="play-mode" type="button" class="mode-button">Mode: Order</button>

      <section class="timer-section" aria-labelledby="timer-heading">
        <h3 id="timer-heading">Sleep timer</h3>
        <p id="timer-status" class="timer-status" aria-live="polite">Off</p>
        <div class="timer-controls">
          <label for="timer-minutes">Minutes</label>
          <input id="timer-minutes" type="number" inputmode="numeric" min="1" max="720" step="1" value="30">
          <label for="timer-presets">Saved</label>
          <select id="timer-presets" aria-label="Saved timer presets"></select>
        </div>
        <div class="timer-buttons">
          <button id="timer-start" type="button" class="primary-button">Start</button>
          <button id="timer-stop" type="button" class="subtle-button">Stop</button>
          <button id="timer-save" type="button" class="subtle-button">Save preset</button>
          <button id="timer-remove" type="button" class="subtle-button">Remove preset</button>
        </div>
      </section>
    </dialog>
  </div>
</body>
</html>
